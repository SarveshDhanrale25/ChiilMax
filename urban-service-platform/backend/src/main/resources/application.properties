server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:h2:mem:urban_service_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@urbanservice.local}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:Admin@1234}